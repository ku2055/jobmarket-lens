# Weekly: collect postings, rebuild the dashboard, commit it, and publish the site.
# The SQLite history (data/lens.db) is too large for git, so it is kept as the asset of a
# release named "data" and restored before each run.
name: Collect and publish

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      max:
        description: "Max postings per company (blank = config default)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data -p lens.db.gz -D data || echo "no history yet"
          [ -f data/lens.db.gz ] && gunzip -f data/lens.db.gz || true
      - name: Collect
        run: python -m collector.run ${{ github.event.inputs.max && format('--max {0}', github.event.inputs.max) || '' }}
      - name: Build dataset
        run: python scripts/build_dataset.py
      - name: Save history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -kf data/lens.db data/normalized/postings.csv
          gh release view data >/dev/null 2>&1 || gh release create data --title "Posting history" --notes "SQLite history used by the collector (lens.db.gz) and the normalized postings (postings.csv.gz). Replaced on every run."
          gh release upload data data/lens.db.gz data/normalized/postings.csv.gz --clobber
      - name: Commit dashboard
        run: |
          git config user.name "jobmarket-lens bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/index.html config/ "data/data source.csv" "data/Job postings.csv"
          git commit -m "Data refresh $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
