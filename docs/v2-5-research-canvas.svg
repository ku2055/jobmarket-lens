<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172b39}.muted{fill:#647882}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:15px}.title{font-size:25px;font-weight:700}.label{font-size:11px;letter-spacing:1.4px;font-weight:700}.heading{font-size:17px;font-weight:700}.white{fill:#fff}</style></defs>
<rect width="1500" height="1040" fill="#f0f3f2"/>
<rect width="1500" height="72" fill="#17383b"/>
<text x="28" y="34" class="heading white">JobMarket Lens</text><text x="28" y="54" class="tiny" style="fill:#b5d2cf">V2.5 / RESEARCH STUDIO</text>
<text x="355" y="43" class="body white">Research canvas</text><text x="545" y="43" class="body" style="fill:#a7c5c2">Saved studies</text><text x="695" y="43" class="body" style="fill:#a7c5c2">Source coverage</text>
<rect x="1215" y="20" width="252" height="33" rx="6" fill="#345559"/><text x="1233" y="41" class="small white">DESIGN ONLY · REVIEW DRAFT</text>
<rect x="0" y="72" width="268" height="968" fill="#fff"/>
<text x="25" y="113" class="label muted">BUILD A RESEARCH QUESTION</text>
<text x="25" y="150" class="heading">What do you want to compare?</text>
<rect x="20" y="171" width="228" height="80" rx="9" fill="#e9f1ef"/><text x="35" y="197" class="body">Work arrangements</text><text x="35" y="223" class="small muted">Roles, skills and posted pay</text><text x="35" y="241" class="tiny muted">Suggested study · edit any scope</text>
<text x="25" y="291" class="label muted">01 / DEFINE THE POPULATION</text><text x="25" y="322" class="body">Posting inventory</text><text x="25" y="344" class="small muted">Combined · version pinned</text><line x1="25" y1="365" x2="241" y2="365" stroke="#e3e8e5"/>
<text x="25" y="403" class="label muted">02 / MAKE TWO PERSPECTIVES</text>
<rect x="25" y="425" width="216" height="42" rx="7" fill="#eeedfc"/><text x="39" y="452" class="body" style="fill:#5148b0">A / Remote</text>
<rect x="25" y="478" width="216" height="42" rx="7" fill="#e3f0eb"/><text x="39" y="505" class="body" style="fill:#177357">B / On-site</text>
<text x="25" y="553" class="small muted">Shared refinements</text><rect x="25" y="568" width="216" height="38" rx="6" fill="#f4f6f4"/><text x="38" y="593" class="small">Occupation / any + unknown</text><rect x="25" y="616" width="216" height="38" rx="6" fill="#f4f6f4"/><text x="38" y="641" class="small">Geography / comparable scope</text>
<text x="25" y="698" class="label muted">03 / INSPECT THE DIFFERENCE</text><text x="25" y="728" class="small muted">A selection updates every panel.</text><text x="25" y="750" class="small muted">Pin to freeze a cohort.</text>
<rect x="25" y="820" width="216" height="102" rx="8" fill="#fff5df"/><text x="39" y="846" class="small">Evidence before conclusions</text><text x="39" y="871" class="tiny muted">Postings describe advertisements.</text><text x="39" y="890" class="tiny muted">They do not establish hires</text><text x="39" y="909" class="tiny muted">or available employees.</text>
<text x="298" y="111" class="label muted">STUDY / WORK ARRANGEMENTS</text><text x="298" y="148" class="title">How does the advertised work differ?</text><text x="298" y="177" class="body muted">One population. Linked views. Every comparison has a denominator.</text>
<rect x="298" y="199" width="1118" height="46" rx="7" fill="#fff"/><text x="315" y="227" class="small">86,190 in the reference release</text><text x="565" y="227" class="small muted">As of Oct 16, 2026</text><text x="790" y="227" class="small muted">Availability: reported / observed</text><text x="1190" y="227" class="small" style="fill:#16705a">Inspect coverage →</text>
<rect x="298" y="265" width="815" height="95" rx="10" fill="#fff"/>
<rect x="315" y="281" width="379" height="62" rx="6" fill="#eeedfc"/><text x="330" y="305" class="label" style="fill:#5148b0">A / REMOTE</text><text x="330" y="331" class="small muted">Predicate · source basis · freeze controls</text>
<rect x="707" y="281" width="389" height="62" rx="6" fill="#e3f0eb"/><text x="722" y="305" class="label" style="fill:#177357">B / ON-SITE</text><text x="722" y="331" class="small muted">Predicate · source basis · freeze controls</text>
<rect x="298" y="379" width="395" height="275" rx="9" fill="#fff"/><text x="317" y="408" class="heading">Occupation composition</text><text x="317" y="430" class="tiny muted">Aligned shares · denominator visible on inspect</text>
<g fill="#8174cb"><rect x="333" y="455" width="238" height="9" rx="3"/><rect x="333" y="491" width="186" height="9" rx="3"/><rect x="333" y="527" width="128" height="9" rx="3"/><rect x="333" y="563" width="88" height="9" rx="3"/></g><g fill="#66a68e"><rect x="333" y="468" width="172" height="9" rx="3"/><rect x="333" y="504" width="225" height="9" rx="3"/><rect x="333" y="540" width="176" height="9" rx="3"/><rect x="333" y="576" width="104" height="9" rx="3"/></g><text x="317" y="626" class="tiny muted">Layout placeholders · no measured bar values</text>
<rect x="711" y="379" width="402" height="275" rx="9" fill="#fff"/><text x="730" y="408" class="heading">Recorded skill differences</text><text x="730" y="430" class="tiny muted">Percentage points · empty skill lists stay in scope</text>
<line x1="916" y1="452" x2="916" y2="589" stroke="#b4c3c0"/>
<rect x="825" y="459" width="91" height="16" rx="3" fill="#8174cb"/><rect x="916" y="492" width="111" height="16" rx="3" fill="#66a68e"/><rect x="870" y="525" width="46" height="16" rx="3" fill="#8174cb"/><rect x="916" y="558" width="62" height="16" rx="3" fill="#66a68e"/><text x="766" y="609" class="small" style="fill:#5148b0">More in A</text><text x="980" y="609" class="small" style="fill:#177357">More in B</text><text x="730" y="634" class="tiny muted">Click a skill to inspect the contributing postings</text>
<rect x="1131" y="265" width="285" height="389" rx="9" fill="#fff"/><text x="1151" y="298" class="label muted">EXPLAIN THIS RESULT</text><text x="1151" y="331" class="heading">Show the basis.</text><text x="1151" y="366" class="small">Metric and counting unit</text><text x="1151" y="393" class="small">Eligible / missing / excluded</text><text x="1151" y="420" class="small">Source and observation dates</text><text x="1151" y="447" class="small">Conflicts and coverage</text><line x1="1151" y1="470" x2="1396" y2="470" stroke="#e3e8e5"/><text x="1151" y="499" class="small muted">Inspect the same contributors</text><text x="1151" y="521" class="small muted">behind the chart and export.</text><rect x="1151" y="557" width="244" height="40" rx="6" fill="#17383b"/><text x="1194" y="583" class="small white">Inspect public records →</text><text x="1151" y="629" class="tiny muted">No private text enters this workspace.</text>
<rect x="298" y="674" width="1118" height="220" rx="9" fill="#fff"/><text x="318" y="705" class="heading">Contributing postings</text><text x="1177" y="705" class="small muted">Exact set / paged</text><rect x="317" y="722" width="1080" height="30" rx="4" fill="#f2f5f2"/><text x="330" y="742" class="small muted">Role / employer</text><text x="780" y="742" class="small muted">Arrangement</text><text x="1030" y="742" class="small muted">Evidence basis</text><line x1="317" y1="792" x2="1396" y2="792" stroke="#e3e8e5"/><line x1="317" y1="831" x2="1396" y2="831" stroke="#e3e8e5"/><text x="330" y="777" class="small muted">Selected public records appear here after an explicit query.</text><text x="330" y="868" class="tiny muted">Keyboard selection · stable sorting · safe CSV · reproducible study link</text>
<text x="298" y="934" class="small muted">Proposed interaction: select → compare → inspect → pin → export.</text><text x="298" y="962" class="small muted">No full posting table is required in the browser for aggregate comparisons.</text><text x="298" y="1005" class="tiny muted">V2.5 design artifact. Reference release count is from V2; chart marks are schematic placeholders.</text>
</svg>
