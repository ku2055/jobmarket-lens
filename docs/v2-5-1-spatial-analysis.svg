<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">JobMarket Lens V2.5.1 Spatial Lab design concept</title><desc id="desc">An illustrative three-dimensional arrangement shelf view, linked evidence rail, coverage cube and exact contributor table. This is a design wireframe, not a computed three-dimensional analysis.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#173e43}.small{font-size:13px;fill:#567176}.label{font-size:11px;letter-spacing:1.4px;font-weight:bold;fill:#567176}.h{font-size:24px;font-weight:bold}.card{fill:#fff;stroke:#dce5df}.line{stroke:#a9c1b9;fill:none}.number{font-size:32px;font-weight:bold}</style><pattern id="grid" width="50" height="35" patternUnits="userSpaceOnUse"><path d="M50 0H0V35" fill="none" stroke="#c5d8cf" stroke-width="1"/></pattern></defs>
<rect width="1440" height="1120" fill="#f4f6f3"/><rect width="1440" height="74" fill="white"/><path d="M0 74H1440" stroke="#dce5df"/>
<rect x="28" y="20" width="34" height="34" rx="10" fill="#173e43"/><circle cx="43" cy="34" r="9" fill="none" stroke="#77c5b7" stroke-width="2"/><path d="M49 41L55 47M39 37V33M43 37V29M47 37V31" stroke="#e4b45f" stroke-width="2"/>
<text x="76" y="35" font-size="20" font-weight="bold">JobMarket Lens</text><text x="76" y="53" class="label">SPATIAL LAB / V2.5.1</text>
<text x="570" y="43" font-size="14">Demand shelves</text><text x="740" y="43" class="small">Coverage &amp; issues</text><text x="924" y="43" class="small">Skill neighborhood</text><rect x="1255" y="23" width="150" height="30" rx="7" fill="#e8f0eb"/><text x="1276" y="43" class="small">DESIGN ONLY</text>
<text x="30" y="111" class="label">SAME QUESTION. ANOTHER PERSPECTIVE.</text><text x="30" y="151" font-size="34" font-weight="bold">Find the pattern. Inspect the evidence.</text><text x="30" y="177" class="small">Bounded aggregate scenes over the Node semantic API. Every selection has exact contributors and a 2D equivalent.</text>
<rect x="30" y="204" width="1380" height="52" rx="10" class="card"/><text x="48" y="235" font-size="14" font-weight="bold">Combined • reported / observed open</text><text x="420" y="235" class="small">82,851 matching / 86,190 snapshot records</text><text x="875" y="235" class="small">Release audited 2026-10-16</text><text x="1245" y="235" font-size="14">A / B • Export</text>
<rect x="30" y="276" width="968" height="510" rx="14" class="card"/><text x="52" y="306" class="label">01 / DEMAND SHELVES</text><text x="52" y="337" class="h">Occupation × level × arrangement</text><text x="52" y="360" class="small">All employers by default. Up to 736 category cells, including unknowns.</text>
<rect x="744" y="296" width="230" height="35" rx="7" fill="#edf3ef"/><rect x="748" y="300" width="104" height="27" rx="5" fill="#28776d"/><text x="774" y="319" font-size="13" style="fill:white">3D inspect</text><text x="873" y="319" class="small">2D shelves</text>
<g transform="translate(155 502) skewX(-26)"><rect width="600" height="190" fill="#f3eee3" fill-opacity=".4" stroke="#d0c4a6"/></g>
<g transform="translate(155 460) skewX(-26)"><rect width="600" height="190" fill="#edf4f0" stroke="#b5cec2"/><rect width="600" height="190" fill="url(#grid)"/></g>
<g transform="translate(155 418) skewX(-26)"><rect width="600" height="190" fill="#f5f8f6" fill-opacity=".58" stroke="#a9c6b7"/></g>
<g transform="translate(155 376) skewX(-26)"><rect width="600" height="190" fill="#e6efea" fill-opacity=".26" stroke="#a9c6b7"/></g>
<g fill="#77c5b7" stroke="#28776d" stroke-width="1.5"><circle cx="189" cy="478" r="12"/><circle cx="294" cy="450" r="18"/><circle cx="390" cy="500" r="9"/><circle cx="486" cy="435" r="20"/><circle cx="557" cy="530" r="15"/><circle cx="669" cy="468" r="12"/><circle cx="237" cy="566" r="10"/><circle cx="348" cy="578" r="14"/><circle cx="426" cy="552" r="8"/><circle cx="627" cy="594" r="17"/></g>
<circle cx="486" cy="435" r="27" fill="none" stroke="#e4b45f" stroke-width="3"/><path d="M512 426L622 395H776" fill="none" stroke="#173e43"/><text x="638" y="388" font-size="13" font-weight="bold">Selected aggregate cell</text><text x="784" y="426" class="small">Remote</text><text x="784" y="468" class="small">Hybrid</text><text x="784" y="510" class="small">On-site</text><text x="784" y="552" class="small">Unknown shelf</text>
<text x="260" y="686" class="small">Occupation category slots →</text><text x="63" y="628" class="small" transform="rotate(-65 63 628)">Level category slots →</text>
<rect x="50" y="716" width="928" height="48" rx="8" fill="#f4f7f4"/><text x="66" y="736" class="small">Inspect / Select • Isolate shelf • Front / Top / Side • Reset camera • Exact cell list</text><text x="66" y="754" font-size="11" fill="#567176">Glyph area encodes count. Category spacing is not distance. Illustrated glyph positions are not computed data.</text>
<rect x="1018" y="276" width="392" height="510" rx="14" class="card"/><text x="1040" y="307" class="label">EVIDENCE RAIL / EXACT CONTRIBUTORS</text><text x="1040" y="338" class="h">What supports this view?</text><text x="1040" y="367" class="small">Selected cell → count, denominator, source basis</text><rect x="1040" y="385" width="348" height="67" rx="9" fill="#eaf3ee"/><text x="1054" y="409" font-size="14" font-weight="bold">Apply cell selection</text><text x="1054" y="434" class="small">Server resolves union, distinct IDs and hash</text>
<text x="1040" y="483" class="label">CURRENT SNAPSHOT DIAGNOSTIC</text><text x="1040" y="520" class="number">46</text><text x="1110" y="506" font-size="13">Raw status-value differences</text><text x="1110" y="525" class="small">Different observation/reporting basis</text><path d="M1040 544H1388" stroke="#dce5df"/><text x="1040" y="582" class="number">0</text><text x="1110" y="568" font-size="13">Normalized state disagreements</text><text x="1110" y="587" class="small">Both sources describe open postings</text>
<rect x="1040" y="612" width="348" height="80" rx="8" fill="#fbf4e9"/><text x="1054" y="638" font-size="13" font-weight="bold">Unknown information is not an error.</text><text x="1054" y="659" class="small">Pay eligibility, location precision and source</text><text x="1054" y="677" class="small">basis remain separate diagnostic classes.</text><text x="1040" y="728" font-size="13">View evidence • Pin A / B • Inspect records</text><text x="1040" y="753" class="small">The 2D list supports the same complete workflow.</text>
<rect x="30" y="806" width="470" height="214" rx="12" class="card"/><text x="50" y="835" class="label">02 / COVERAGE CUBE</text><path d="M85 968L260 1001L440 928M85 968V869M260 1001V902" class="line"/><path d="M85 968L265 895L440 928" class="line"/><g fill="#28776d"><circle cx="171" cy="927" r="7"/><circle cx="237" cy="940" r="6"/><circle cx="288" cy="910" r="9"/><circle cx="351" cy="934" r="6"/></g><text x="55" y="860" class="small">311 employer aggregates • explicit metric axes</text><text x="55" y="997" font-size="11">Known country % × USD eligibility % × log posting count</text>
<rect x="520" y="806" width="425" height="214" rx="12" class="card"/><text x="540" y="835" class="label">03 / SKILL NEIGHBORHOOD</text><g stroke="#b4cec2"><path d="M637 907L709 867L781 925L845 887M637 907L712 969L781 925M709 867L712 969M637 907L781 925" fill="none"/></g><g fill="#77c5b7" stroke="#28776d"><circle cx="637" cy="907" r="12"/><circle cx="709" cy="867" r="16"/><circle cx="781" cy="925" r="13"/><circle cx="845" cy="887" r="9"/><circle cx="712" cy="969" r="10"/></g><text x="540" y="998" font-size="11">Supported co-mentions • layout distance is qualitative</text>
<rect x="965" y="806" width="445" height="214" rx="12" class="card"/><text x="985" y="835" class="label">ALWAYS AVAILABLE / 2D &amp; EVIDENCE</text><g stroke="#dce5df"><path d="M985 875H1389M985 908H1389M985 941H1389M985 974H1389"/></g><text x="993" y="862" class="small">Cell / pair</text><text x="1190" y="862" class="small">Count / basis</text><text x="993" y="898" font-size="13">Keyboard-selectable rows</text><text x="993" y="930" font-size="13">100-record contributor page</text><text x="993" y="962" font-size="13">Exact 37-column CSV</text><text x="993" y="994" font-size="13">Same source, cohort and release</text>
<text x="30" y="1054" font-size="13" font-weight="bold">DESIGN CONCEPT — no 3D implementation or projection was created.</text><text x="30" y="1078" class="small">Real snapshot facts appear in the header and diagnostic rail. Scene glyphs are illustrative. V2 and V2.5 remain live independently.</text>
</svg>
